# HackerAI - self-hosted Convex (backend + dashboard) as a Coolify
# "Docker Compose Empty" resource. Based on Coolify's built-in Convex template
# and get-convex self-hosted/docker/docker-compose.yml.
#
# Domains to set in the Coolify UI (the :port suffix picks the container port):
#   backend   -> https://hackerai-convex.bolaxax.cloud:3210,https://hackerai-convex-site.bolaxax.cloud:3211
#   dashboard -> https://hackerai-convex-dash.bolaxax.cloud:6791
# After the first boot, in the backend container terminal: ./generate_admin_key.sh
# Pin both images to the same explicit tag once the first deploy works
# (upgrades can migrate data in place, so run `convex export` first).
services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    volumes:
      - convex-data:/convex/data
    environment:
      - SERVICE_URL_BACKEND_3210
      - SERVICE_URL_SITE_3211
      - INSTANCE_NAME=${INSTANCE_NAME:-hackerai}
      # Generated and persisted by Coolify. Never change it after the first
      # boot: admin keys derive from it.
      - INSTANCE_SECRET=${SERVICE_HEX_64_SECRET}
      # Public sync/API URL. It must equal NEXT_PUBLIC_CONVEX_URL and
      # CONVEX_SELF_HOSTED_URL.
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-https://hackerai-convex.bolaxax.cloud}
      # Public HTTP-actions URL. HackerAI defines none (no convex/http.ts), but
      # keep it valid.
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-https://hackerai-convex-site.bolaxax.cloud}
      - DISABLE_BEACON=${DISABLE_BEACON:-false}
      # Keep Prometheus /metrics off the public domain, as upstream's compose does.
      - DISABLE_METRICS_ENDPOINT=${DISABLE_METRICS_ENDPOINT:-true}
      # Match Convex cloud production: clients see "Server Error" for
      # non-ConvexError failures.
      - REDACT_LOGS_TO_CLIENT=${REDACT_LOGS_TO_CLIENT:-true}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      - SERVICE_URL_DASHBOARD_6791
      # The URL your browser uses to reach the backend from the dashboard.
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_CLOUD_ORIGIN:-https://hackerai-convex.bolaxax.cloud}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex-data:
