# HackerAI - Remote Control runner (isolated Kali) as a Coolify
# "Docker Compose" resource on the same server.
#
# Set in Coolify:
#   HACKERAI_LOCAL_TOKEN  token from Settings -> Remote Control (hsb_...)
#   HACKERAI_RUNNER_NAME  optional name shown in the selector
#
# The container gets no Docker socket, no host volumes and no privileged
# mode, so Agent commands cannot reach Coolify, Convex data or other secrets.
# It only needs outbound network access (Convex and the relay over HTTPS).
services:
  runner:
    build:
      context: ./kali-runner
    environment:
      - HACKERAI_LOCAL_TOKEN=${HACKERAI_LOCAL_TOKEN}
      - HACKERAI_CONVEX_URL=https://hackerai-convex.bolaxax.cloud
      - HACKERAI_RUNNER_NAME=${HACKERAI_RUNNER_NAME:-Servidor Kali}
    restart: unless-stopped
    # Docker's default capabilities (no SYS_ADMIN) plus NET_ADMIN for
    # masscan/nmap options; NET_RAW is already in the default set.
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    volumes:
      - workspace:/workspace

volumes:
  workspace:
